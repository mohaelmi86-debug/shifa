name: SHIFA RLS v2 policy contract

on:
  pull_request:
    paths:
      - 'supabase/tests/rls_v2_policy_contract.sql'
      - 'supabase/tests/fixtures/rls_v2_policy_contract_fixture.sql'
      - '.github/workflows/shifa-rls-policy-contract.yml'
  push:
    branches:
      - security/shifa-rls-v2-staging
    paths:
      - 'supabase/tests/rls_v2_policy_contract.sql'
      - 'supabase/tests/fixtures/rls_v2_policy_contract_fixture.sql'
      - '.github/workflows/shifa-rls-policy-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shifa_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shifa_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Locate PostgreSQL service container
        shell: bash
        run: |
          container_id="$(docker ps -q --filter 'ancestor=postgres:17' | head -n 1)"
          test -n "$container_id"
          echo "PG_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"
      - name: Build synthetic catalog fixture
        run: docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 < supabase/tests/fixtures/rls_v2_policy_contract_fixture.sql
      - name: Contract passes on safe fixture
        run: docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 < supabase/tests/rls_v2_policy_contract.sql
      - name: Contract rejects a simulated admin bypass
        shell: bash
        run: |
          docker exec "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 -c "CREATE POLICY simulated_platform_admin_bypass ON public.patients FOR SELECT TO authenticated USING (private.is_platform_admin());"
          if docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 < supabase/tests/rls_v2_policy_contract.sql; then
            echo "::error::Policy contract did not reject the simulated admin bypass"
            exit 1
          else
            echo "Expected rejection confirmed: unsafe admin policy was detected."
          fi
      - name: Contract rejects an admin bypass hidden in a helper
        shell: bash
        run: |
          docker exec "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 -c "DROP POLICY simulated_platform_admin_bypass ON public.patients;"
          docker exec "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION private.belongs_to_org(target_org_id uuid) RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog AS \$\$ SELECT private.is_platform_admin() \$\$;"
          if docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d shifa_contract -v ON_ERROR_STOP=1 < supabase/tests/rls_v2_policy_contract.sql; then
            echo "::error::Policy contract did not reject the helper-level admin bypass"
            exit 1
          else
            echo "Expected rejection confirmed: helper-level admin bypass was detected."
          fi
